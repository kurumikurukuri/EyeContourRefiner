# hpo_aggregate: baseline + 集約特徴 + Optuna HPO (50 trials, 5-fold CV)
# AUC 最大化。scale_pos_weight も探索対象。

data:
  csv_path: "data/samples.csv"
  manifests_dir: "analyses/xgboost_predskip/manifests"
  outputs_dir: "analyses/xgboost_predskip/outputs/hpo_aggregate"

features:
  use_geometry: true
  use_eye_scale: true
  use_face_pose: true
  use_categorical: true
  use_point_index: true
  use_cyclical_angle: false
  use_interactions: false
  use_niqe_score: true
  use_aggregate_features: true

xgboost:
  n_estimators: 2000
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  min_child_weight: 1
  early_stopping_rounds: 50
  random_state: 42
  verbosity: 0
  scale_pos_weight: 0.72

kfold:
  enabled: true
  n_splits: 5
  shuffle: true
  seed: 42

optuna:
  enabled: true
  n_trials: 50
  timeout: null

analysis:
  top_k_misclassified: 500
  subgroup_columns:
    - part_name
    - sub_key
    - point_index
