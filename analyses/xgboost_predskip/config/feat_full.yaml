# feat_full: feat_aggregate + image features + pose composite + dataset percentile
# Phase 2A: 既存実装の有効化を全部 ON
#
# 特徴量カテゴリ:
#   - baseline 16 (point_index, is_upper, is_left_eye, pq_*, eye_*, face_pose, niqe)
#   - aggregate 13 (pq_*_eye_std, *_asymmetry, n_faces, face_*_cross_face_std)
#   - image 14 (eye_gray_*, eye_laplacian_var, eye_sobel_*, eye_canny_density, eye_hog_*, eye_lbp_*)
#   - pose composite 2 (pose_magnitude, niqe_score_x_pose_magnitude)
#   - dataset percentile 2 (niqe_percentile, eye_scale_percentile)
# = 47 特徴量

data:
  csv_path: "data/samples.csv"
  manifests_dir: "analyses/xgboost_predskip/manifests"
  outputs_dir: "analyses/xgboost_predskip/outputs/feat_full"
  image_cache_path: "analyses/xgboost_predskip/outputs/image_features.parquet"

features:
  use_geometry: true
  use_eye_scale: true
  use_face_pose: true
  use_categorical: true
  use_point_index: true
  use_cyclical_angle: false
  use_interactions: false
  use_niqe_score: true
  use_aggregate_features: true
  use_pose_composite: true
  use_dataset_percentile: true
  use_image_features: true

xgboost:
  n_estimators: 2000
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  min_child_weight: 1
  early_stopping_rounds: 50
  random_state: 42
  verbosity: 1
  scale_pos_weight: 0.72

analysis:
  top_k_misclassified: 500
  subgroup_columns:
    - part_name
    - sub_key
    - point_index
