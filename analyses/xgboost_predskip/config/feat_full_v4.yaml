# feat_full_v4: feat_full_v3 + Open Images 画像クラス特徴量
#
# 追加: is_boy, is_girl, is_man, is_woman, is_person (Open Images image-level labels)
# 計 58 + 5 = 63 特徴量

data:
  csv_path: "data/samples.csv"
  manifests_dir: "analyses/xgboost_predskip/manifests"
  outputs_dir: "analyses/xgboost_predskip/outputs/feat_full_v4"
  image_cache_path: "analyses/xgboost_predskip/outputs/image_features.parquet"

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

features:
  use_geometry: true
  use_eye_scale: true
  use_face_pose: true
  use_categorical: true
  use_point_index: true
  use_cyclical_angle: false
  use_interactions: false
  use_niqe_score: true
  use_aggregate_features: true
  use_extended_aggregate: true
  use_pose_composite: true
  use_dataset_percentile: true
  use_image_features: true
  use_eye_brightness: true
  use_oi_class_features: true

xgboost:
  n_estimators: 2000
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  min_child_weight: 1
  early_stopping_rounds: 50
  random_state: 42
  verbosity: 1
  scale_pos_weight: 0.72

analysis:
  top_k_misclassified: 500
  subgroup_columns:
    - part_name
    - sub_key
    - point_index
