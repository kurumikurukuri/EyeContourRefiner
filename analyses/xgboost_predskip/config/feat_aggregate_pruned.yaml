# feat_aggregate_pruned: 低重要度の 4 特徴を除外 + 集約特徴
# 除外: is_upper, pq_dist, pq_angle, point_index（baseline 重要度下位）
# HPO なし。

data:
  csv_path: "data/samples.csv"
  manifests_dir: "analyses/xgboost_predskip/manifests"
  outputs_dir: "analyses/xgboost_predskip/outputs/feat_aggregate_pruned"

features:
  use_geometry: true
  use_eye_scale: true
  use_face_pose: true
  use_categorical: true
  use_point_index: true
  use_cyclical_angle: false
  use_interactions: false
  use_niqe_score: true
  use_aggregate_features: true
  exclude_features:
    - is_upper
    - pq_dist
    - pq_angle
    - point_index

xgboost:
  n_estimators: 2000
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  min_child_weight: 1
  early_stopping_rounds: 50
  random_state: 42
  verbosity: 1
  scale_pos_weight: 0.72

analysis:
  top_k_misclassified: 500
  subgroup_columns:
    - part_name
    - sub_key
    - point_index
