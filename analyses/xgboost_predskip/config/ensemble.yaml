# ensemble: XGB + LightGBM + CatBoost ヘテロアンサンブル
# Phase 3B: 3 モデル × 3 seeds の単純平均
# 全特徴量 (feat_full_v2 = 57) + GroupKFold

data:
  csv_path: "data/samples.csv"
  manifests_dir: "analyses/xgboost_predskip/manifests"
  outputs_dir: "analyses/xgboost_predskip/outputs/ensemble"
  image_cache_path: "analyses/xgboost_predskip/outputs/image_features.parquet"

features:
  use_geometry: true
  use_eye_scale: true
  use_face_pose: true
  use_categorical: true
  use_point_index: true
  use_cyclical_angle: false
  use_interactions: false
  use_niqe_score: true
  use_aggregate_features: true
  use_extended_aggregate: true
  use_pose_composite: true
  use_dataset_percentile: true
  use_image_features: true

kfold:
  enabled: true
  n_splits: 5
  shuffle: true
  seed: 42

ensemble:
  seeds: [42, 7, 123]
  use_xgb: true
  use_lgbm: true
  use_cat: true

  # HPO 最適 (test AUC 0.9516, CV AUC 0.9582)
  xgb_params:
    n_estimators: 2894
    max_depth: 3
    learning_rate: 0.1110867311732797
    subsample: 0.9351110265305435
    colsample_bytree: 0.6249535630624325
    reg_alpha: 1.2244881268361527
    reg_lambda: 7.556431835909817
    min_child_weight: 26
    early_stopping_rounds: 50
    scale_pos_weight: 0.700326129987584

  lgbm_params:
    n_estimators: 2000
    num_leaves: 31
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.7
    reg_alpha: 0.5
    reg_lambda: 3.0
    min_child_samples: 30
    early_stopping_rounds: 50
    scale_pos_weight: 0.72

  cat_params:
    iterations: 2000
    depth: 5
    learning_rate: 0.05
    l2_leaf_reg: 5.0
    early_stopping_rounds: 50
    scale_pos_weight: 0.72
