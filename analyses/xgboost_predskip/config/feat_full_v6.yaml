# feat_full_v6: feat_full_v3 + OI class features
#
# 追加: use_oi_class_features（is_boy/girl/man/woman/person/sunglasses/glasses/goggles）
# Open Images 画像ラベル 8 特徴量で性別・眼鏡・サングラスを直接識別
# 計 58 + 8 = 66 特徴量

data:
  csv_path: "analyses/samples.csv"
  manifests_dir: "analyses/xgboost_predskip/manifests"
  outputs_dir: "analyses/xgboost_predskip/outputs/feat_full_v6"
  image_cache_path: "analyses/xgboost_predskip/outputs/image_features.parquet"

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

features:
  use_geometry: true
  use_eye_scale: true
  use_face_pose: true
  use_categorical: true
  use_point_index: true
  use_cyclical_angle: true
  use_interactions: true
  use_niqe_score: true
  use_aggregate_features: true
  use_extended_aggregate: true
  use_pose_composite: true
  use_dataset_percentile: true
  use_image_features: true
  use_eye_brightness: true
  use_oi_class_features: true

xgboost:
  n_estimators: 2000
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  min_child_weight: 1
  early_stopping_rounds: 50
  random_state: 42
  verbosity: 1
  scale_pos_weight: 0.72

analysis:
  top_k_misclassified: 500
  subgroup_columns:
    - part_name
    - sub_key
    - point_index
