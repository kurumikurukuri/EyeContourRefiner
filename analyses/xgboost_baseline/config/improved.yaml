# xgboost_baseline 改良版: cyclical angle + interaction + Optuna HPO + k-fold
#
# baseline との差分:
#   features: use_cyclical_angle=true, use_interactions=true
#   kfold:    enabled=true, n_splits=5
#   optuna:   enabled=true, n_trials=50

data:
  csv_path: "data/samples.csv"
  manifests_dir: "analyses/xgboost_baseline/manifests"
  outputs_dir: "analyses/xgboost_baseline/outputs/exp15_improved"

target:
  t_resolution: null

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  exclude_skip_flag: true
  seed: 42

features:
  use_geometry: true
  use_eye_scale: true
  use_face_pose: true
  use_categorical: true
  use_point_index: true
  use_cyclical_angle: true   # pq_angle を sin/cos に分解
  use_interactions: true      # is_upper × pq_ratio, is_upper × dist_from_center

xgboost:
  n_estimators: 2000
  # max_depth / learning_rate 等は Optuna で上書きされる（初期値は参考値）
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  min_child_weight: 1
  early_stopping_rounds: 50
  random_state: 42
  verbosity: 0

quantile:
  q_lo: 0.1
  q_hi: 0.9

iforest:
  n_estimators: 200
  contamination: "auto"
  max_samples: "auto"
  random_state: 42

kfold:
  enabled: true
  n_splits: 5
  shuffle: true
  seed: 42

optuna:
  enabled: true
  n_trials: 50
  timeout: null   # 秒。null = 制限なし

outlier:
  top_k: 500
  weight_uncertainty: 0.4
  weight_range_violation: 0.3
  weight_iforest: 0.3
  t_valid_min: 0.0
  t_valid_max: 1.5
