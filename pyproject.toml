[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyeliner-detector"
version = "0.1.0"
description = "アイライン輪郭検出 CNN のモデル R&D パイプライン — face_makeup 向け ONNX モデル生成"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "kurumikurukuri" },
]
keywords = ["eyeliner", "makeup", "beauty-ai", "onnx", "cnn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mediapipe>=0.10.21,<0.10.30",
    "torch>=2.0,<3",
    "torchvision>=0.15,<1",
    "onnx>=1.14",
    "onnxruntime>=1.14",
    "fastapi>=0.117",
    "uvicorn[standard]>=0.23",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "packaging>=23",
    "httpx2>=2.0.0",  # starlette.testclient が要求（tests/test_t_pred_webui_server.py）
    "black",
    "isort",
    "ruff",
]
analysis = [
    # 分析・可視化・エクスポート用。学習/推論だけなら不要。
    "tensorboard>=2.14",   # 学習ログ可視化（任意）
    "scikit-image==0.26",  # tools/csv_export, analyses/xgboost_baseline
    "pyiqa==0.1.15",       # tools/csv_export（NIQE 再計算）
    "thop>=0.1.1",         # tools/model_benchmark（MACs 推定）
]

[project.urls]
Repository = "https://github.com/kurumikurukuri/EyelinerDetector"

[tool.setuptools.packages.find]
include = ["eyeliner*", "scripts*", "tools*", "annotator*", "analyses*"]

[tool.pytest.ini_options]
markers = [
    "requires_data: tests that require large data files (data/samples.db, Open Images downloads)",
]
