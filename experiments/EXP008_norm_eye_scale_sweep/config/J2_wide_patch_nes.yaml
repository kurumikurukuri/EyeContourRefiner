# J2_wide_patch_nes: EXP006 H2_wide_patch + norm_eye_scale 追加
# 目的: wide patch range 構成に norm_eye_scale を加えた場合の効果確認
backbone: custom
loss_fn: t
use_pq_ratio: false
use_norm_eye_scale: true
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 3
use_t_weighted_sampler: false
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 5
patience: 50
seed: 42
aug_flags: 79
patch_t_min: -1.0
patch_t_max: 2.0
patch_perp_scale: 1.0
patch_h: 64
patch_w: 128
label_t_min: -0.5
label_t_max: 1.5
