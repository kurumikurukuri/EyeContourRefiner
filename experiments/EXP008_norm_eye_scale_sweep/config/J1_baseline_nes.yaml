# J1_baseline_nes: EXP006 H1_baseline + norm_eye_scale 追加
# 目的: 画像解像度正規化済み eye_scale をスカラー入力として加えた場合の効果確認
backbone: custom
loss_fn: t
use_pq_ratio: false
use_norm_eye_scale: true
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 3
use_t_weighted_sampler: false
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 5
patience: 50
seed: 42
aug_flags: 79
patch_t_min: -0.5
patch_t_max: 1.5
patch_perp_scale: 1.0
patch_h: 64
patch_w: 128
label_t_min: null
label_t_max: null
