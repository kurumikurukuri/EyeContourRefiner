# EXP028 LN0_baseline: label_noise_sigma=0（対照群）。
# 他は全て EXP026 k3_b32 (= EXP025 A0 = EXP024 bc32_pw8 baseline) に固定。
# perspective_aug（EXP027）は本実験の対象軸ではないため無効のまま。
backbone: custom_dual
fusion_mode: independent
pq_rescale_mode_b: eye_scale
loss_fn: t_l1
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 63
endpoint_blend_range: 0.25
base_channel: 32
pool_width: 8
use_is_upper: true
label_noise_sigma: 0.0
