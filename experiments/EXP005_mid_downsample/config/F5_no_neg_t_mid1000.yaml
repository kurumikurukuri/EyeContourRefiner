# F5: t<0 除外 + mid=1000 ダウンサンプル（F2レベル）
# F4とF2の組み合わせ。除外+ダウンサンプルの相乗効果を確認
backbone: custom
loss_fn: t
use_pq_ratio: false
use_sigmoid: true
num_conv_layers: 3
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 100
batch: 32
k: 5
patience: 50
seed: 42
use_batchnorm: true
aug_flags: 79
t_filter_min: 0.0
mid_max: 1000
mid_t_low: 0.2
mid_t_high: 0.8
