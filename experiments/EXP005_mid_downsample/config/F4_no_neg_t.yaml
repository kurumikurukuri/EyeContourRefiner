# F4: t<0 を外れ値として除外（midダウンサンプルなし）
# t<0 は39件(1.2%) — アイライン輪郭の始点Pより手前に外れたアノテーション点
# 効果を単独で確認するため midは変更しない
backbone: custom
loss_fn: t
use_pq_ratio: false
use_sigmoid: true
num_conv_layers: 3
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 100
batch: 32
k: 5
patience: 50
seed: 42
use_batchnorm: true
aug_flags: 79
t_filter_min: 0.0
mid_t_low: 0.2
mid_t_high: 0.8
