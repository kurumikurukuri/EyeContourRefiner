# F2: mid領域を1000サンプルにダウンサンプル
# edge_low=5.2%, mid=53.0%, edge_high=41.7% (total ~1886)
backbone: custom
loss_fn: t
use_pq_ratio: false
use_sigmoid: true
num_conv_layers: 3
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 100
batch: 32
k: 5
patience: 50
seed: 42
use_batchnorm: true
aug_flags: 79
mid_max: 1000
mid_t_low: 0.2
mid_t_high: 0.8
