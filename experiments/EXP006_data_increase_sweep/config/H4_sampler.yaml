# H4_sampler: t_weighted_sampler alpha=3.0（EXP002では逆効果、データ増で改善を期待）
# 目的: 3150件では少数クラスが少なすぎてサンプラーが機能しなかったが
#       4700+件ではedge帯が増えてサンプラーが有効になるか検証
backbone: custom
loss_fn: t
use_pq_ratio: false
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 3
use_t_weighted_sampler: true
t_weight_alpha: 3.0
t_loss_alpha: 3.0
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 5
patience: 50
seed: 42
aug_flags: 79
# patch パラメータ: EXP002デフォルト（H1と揃える）
patch_t_min: -0.5
patch_t_max: 1.5
patch_perp_scale: 1.0
patch_h: 64
patch_w: 128
label_t_min: null
label_t_max: null
