# EXP025 A1: aux={face_pitch_sin, face_pitch_cos, position_polar_cos}, is_upper 撤去。
# 非冗長×relevant の唯一候補（face_pitch(sin/cos) + 幾何anchor(position_polar_cos)）。
# position_polar_sin OFF = 明示上下なし。
backbone: custom_dual
fusion_mode: independent
pq_rescale_mode_b: eye_scale
loss_fn: t_l1
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 63
endpoint_blend_range: 0.25
base_channel: 32
pool_width: 8
use_aux_face_shape: true
aux_features: [face_pitch_sin, face_pitch_cos, position_polar_cos]
use_is_upper: false
