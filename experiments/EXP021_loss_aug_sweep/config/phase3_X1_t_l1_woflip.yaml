# EXP021 Phase 3: t_l1 + woflip。dual-branch X1_independent（none + eye_scale）。
# EXP020 X1_independent_none_eye_scale の loss_fn / aug_flags を変更したもの。
# 枝A = 生 PQ（raw_t）、枝B = P'Q' eye_scale*0.2（t_prime）
backbone: custom_dual
fusion_mode: independent
pq_rescale_mode_b: eye_scale
loss_fn: t_l1
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 63
endpoint_blend_range: 0.25
