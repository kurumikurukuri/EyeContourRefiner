# EXP022 variant: base_channel=32, pool_width=32
# EXP021 Phase3 ベスト構成（dual independent, loss=t_l1, aug=woflip(63), EBR=0.25）と等価
# （= experiments/EXP021_loss_aug_sweep/outputs/phase3_X1_t_l1_woflip、再現性チェック兼比較ベースライン）。
backbone: custom_dual
fusion_mode: independent
pq_rescale_mode_b: eye_scale
loss_fn: t_l1
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 63
endpoint_blend_range: 0.25
base_channel: 32
pool_width: 32
