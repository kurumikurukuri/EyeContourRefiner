# EXP030 AF1_p0p25: aug_prob=0.5 → BRIGHTNESS/BLUR/COLOR_TEMP/FLIP の発火確率を
# 基準0.5から0.25へ半減（FLIP は aug_flags=63 のため無効）。他は AF0_baseline と同一（aug_prob のみ変更）。
backbone: custom_dual
fusion_mode: independent
pq_rescale_mode_b: eye_scale
loss_fn: t_l1
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 63
aug_prob: 0.5
endpoint_blend_range: 0.25
base_channel: 32
pool_width: 8
use_is_upper: true
