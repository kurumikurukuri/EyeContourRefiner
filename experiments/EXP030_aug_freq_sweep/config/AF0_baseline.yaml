# EXP030 AF0_baseline: aug_prob=1.0（現行標準と同一 = anchor）。
# BRIGHTNESS/BLUR/COLOR_TEMP/FLIP の発火確率は基準値 0.5 のまま
# （FLIP は aug_flags=63 のため無効）。他は EXP029 baseline（db_replica）と同一構成。
backbone: custom_dual
fusion_mode: independent
pq_rescale_mode_b: eye_scale
loss_fn: t_l1
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 63
aug_prob: 1.0
endpoint_blend_range: 0.25
base_channel: 32
pool_width: 8
use_is_upper: true
