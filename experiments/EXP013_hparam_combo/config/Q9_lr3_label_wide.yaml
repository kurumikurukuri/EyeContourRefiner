# Q9_lr3_label_wide: Q2 + patch_t/label_t 範囲拡大（-2.0,3.0 / -1.0,2.0）
backbone: custom
loss_fn: t
use_pq_ratio: false
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
use_t_weighted_sampler: false
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 5
patience: 50
seed: 42
aug_flags: 79
patch_t_min: -2.0
patch_t_max: 3.0
patch_perp_scale: 1.0
patch_h: 64
patch_w: 64
label_t_min: -1
label_t_max: 2
