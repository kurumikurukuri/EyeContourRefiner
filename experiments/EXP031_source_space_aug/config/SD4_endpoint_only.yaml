# EXP031 SD4_endpoint_only: photometric aug 5種を全 OFF にし、ENDPOINT_BLEND のみ有効。
# BRIGHTNESS/BLUR/NOISE/COLOR_TEMP/GRAYSCALE を落とし、幾何系（R保存）の ENDPOINT_BLEND
# だけを残す。FLIP は baseline から変わらず off。source 系（JPEG/解像度ジッタ）も off。
backbone: custom_dual
fusion_mode: independent
pq_rescale_mode_b: eye_scale
loss_fn: t_l1
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 32   # = 0x020: ENDPOINT_BLEND のみ（他 photometric 5種・FLIP・source系は全 off）
aug_prob: 1.0
endpoint_blend_range: 0.25
base_channel: 32
pool_width: 8
use_is_upper: true
