# EXP031 SD2_resjitter: 解像度ジッタのみ。
# ワープ前の元画像 ROI を 1/s に縮小（INTER_AREA）してから元サイズへ拡大（INTER_LINEAR）し、
# 「小さい顔／低解像度カメラ」を模擬する。s ∈ [1.0, 2.5]。
# 発火確率は SD1 と共通の 0.5。
backbone: custom_dual
fusion_mode: independent
pq_rescale_mode_b: eye_scale
loss_fn: t_l1
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 319  # = 63 | AUG_SOURCE_RES_JITTER(0x100)
aug_prob: 1.0
endpoint_blend_range: 0.25
base_channel: 32
pool_width: 8
use_is_upper: true

# 元画像空間の劣化 aug（EXP031 の変動軸）。ON/OFF は上の aug_flags のビット、
# 以下は強度パラメータ。
source_res_jitter_prob: 0.5
source_res_scale_min: 1.0
source_res_scale_max: 2.5
