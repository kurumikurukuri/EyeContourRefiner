# EXP023 OOF用: EXP022 bc16_pw1 のコピー（悪いモデル, holdout raw-t MAE 最悪 0.092032）。
# 元: experiments/EXP022_channel_pool_sweep/config/bc16_pw1.yaml
# base_channel=16, pool_width=1。EXP021 Phase3 ベスト構成（dual independent, loss=t_l1,
# aug=woflip(63), EBR=0.25）を土台に base_channel/pool_width のみ変更。
# k はEXP022内部CV用の値で、EXP023のOOF実行では使わない（fold数は manifests/fold{1..5}.csv で決まる）。
backbone: custom_dual
fusion_mode: independent
pq_rescale_mode_b: eye_scale
loss_fn: t_l1
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 63
endpoint_blend_range: 0.25
base_channel: 16
pool_width: 1
