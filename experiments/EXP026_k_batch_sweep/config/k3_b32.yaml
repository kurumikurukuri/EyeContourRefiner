# EXP026 k3_b32: k×batch sweep の anchor 構成。
# 他は全て EXP025 A0 (= EXP024 bc32_pw8 baseline) に固定。
# k=3, batch=32 は現行デフォルト。EXP025 A0 holdout MAE ≈ 0.0863 を再現するはず。
backbone: custom_dual
fusion_mode: independent
pq_rescale_mode_b: eye_scale
loss_fn: t_l1
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 63
endpoint_blend_range: 0.25
base_channel: 32
pool_width: 8
use_is_upper: true
