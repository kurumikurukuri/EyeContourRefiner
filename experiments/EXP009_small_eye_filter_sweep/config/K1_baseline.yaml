# K1_H1: EXP006 H1_baseline 条件 / 小さい目(下位20%)を除外したデータで学習
# 目的: eye_scale フィルタリングの効果を H1 ベースラインで確認
backbone: custom
loss_fn: t
use_pq_ratio: false
use_norm_eye_scale: false
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 3
use_t_weighted_sampler: false
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 5
patience: 50
seed: 42
aug_flags: 79
patch_t_min: -0.5
patch_t_max: 1.5
patch_perp_scale: 1.0
patch_h: 64
patch_w: 128
label_t_min: null
label_t_max: null
