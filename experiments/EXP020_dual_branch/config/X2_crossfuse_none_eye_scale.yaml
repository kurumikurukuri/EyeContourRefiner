# EXP020 X2_crossfuse (eye_scale): 生PQ + P'Q'(eye_scale) cross-stitch融合
# 枝A = EXP019 X0_baseline（生PQ, raw_t）
# 枝B = EXP019 X2_eye_scale（P'Q' eye_scale×0.2, t_prime）
# 各 ConvBlock 後に CrossStitch で中間特徴を融合。枝別設定はプリセット。
backbone: custom_dual
fusion_mode: crossfuse
pq_rescale_mode_b: eye_scale
loss_fn: t
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 127
