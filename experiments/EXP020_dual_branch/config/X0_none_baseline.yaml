# EXP020 X0_none_baseline: 生PQ座標系 単一CNN（比較基準）
backbone: custom
loss_fn: t
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
use_is_upper: true
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 127
patch_t_min: -2.0
patch_t_max: 3.0
patch_perp_scale: 2.0
patch_h: 64
patch_w: 64
label_t_min: -1
label_t_max: 2
max_train_samples: null
mid_t_keep_ratio: 1.0
pq_rescale_mode: none
