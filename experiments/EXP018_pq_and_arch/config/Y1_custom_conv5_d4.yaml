# EXP018 Y1_custom_conv5_d4: CNN 深化（5 conv layers, dropout=0.4）
# Phase B: アーキテクチャ強化条件1 - conv 層を 4→5 に増やし、dropout を 0.3→0.4 に調整
backbone: custom
loss_fn: t
use_pq_ratio: false
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 5
dropout_rate: 0.4
use_t_weighted_sampler: false
t_weight_alpha: 3.0
use_is_upper: true
use_pq_weighted_sampler: false
pq_weight_alpha: 3.0
pq_threshold: 0.10
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 127
patch_t_min: -2.0
patch_t_max: 3.0
patch_perp_scale: 2.0
patch_h: 64
patch_w: 64
label_t_min: -1
label_t_max: 2
max_train_samples: null
mid_t_keep_ratio: 1.0
