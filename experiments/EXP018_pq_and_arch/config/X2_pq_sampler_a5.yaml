# EXP018 X2_pq_sampler_a5: pq_ratio < 0.10 を WeightedRandomSampler で過剰サンプリング (alpha=5, 強め)
backbone: custom
loss_fn: t
use_pq_ratio: false
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
use_t_weighted_sampler: false
t_weight_alpha: 3.0
use_pq_weighted_sampler: true
pq_weight_alpha: 5.0
use_is_upper: true
pq_threshold: 0.10
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 127
patch_t_min: -2.0
patch_t_max: 3.0
patch_perp_scale: 2.0
patch_h: 64
patch_w: 64
label_t_min: -1
label_t_max: 2
max_train_samples: null
mid_t_keep_ratio: 1.0
