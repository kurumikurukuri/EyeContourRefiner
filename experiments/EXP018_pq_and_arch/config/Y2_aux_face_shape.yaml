# EXP018 Y2_aux_face_shape: グローバル顔形状特徴量を CNN fc 層手前に concat する補助入力
# 特徴量 (11次元): pq_angle_cos/sin, position_polar_cos/sin,
#                  face_yaw/pitch/roll の sin/cos, is_upper
# この条件は train_exp018.py の run_y2_kfold() でカスタム訓練される (scripts/train.py 非経由)
backbone: custom
loss_fn: t
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
dropout_rate: 0.3
use_is_upper: false
use_aux_face_shape: true
lr: 1.0e-3
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 3
patience: 50
seed: 42
aug_flags: 127
patch_t_min: -2.0
patch_t_max: 3.0
patch_perp_scale: 2.0
patch_h: 64
patch_w: 64
label_t_min: -1
label_t_max: 2
