# L1_wide_patch: データv2（~6930件）× H2_wide_patch 条件の再検証
# 目的: DB更新後（5700→6930）のデータ増加が wide_patch ベスト条件にどう影響するか確認
backbone: custom
loss_fn: t
use_pq_ratio: false
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 4
use_t_weighted_sampler: false
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 5
patience: 50
seed: 42
aug_flags: 15
# patch パラメータ: wide_label_base（EXP006 H2_wide_patch ベスト構成）
patch_t_min: -1.0
patch_t_max: 2.0
patch_perp_scale: 1.0
patch_h: 64
patch_w: 128
label_t_min: -0.5
label_t_max: 1.5
