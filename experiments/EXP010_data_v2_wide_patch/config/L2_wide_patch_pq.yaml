# L2_wide_patch_pq: L1 + use_pq_ratio=true
# 目的: pq_ratio（アイラインの目に対する相対長）を補助入力として追加し効果を検証
# pq_ratio は誤差の最も強い予測因子（r=-0.251）なので補助入力として有効な可能性がある
backbone: custom
loss_fn: t
use_pq_ratio: true
use_sigmoid: true
use_batchnorm: true
num_conv_layers: 3
use_t_weighted_sampler: false
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 200
batch: 32
k: 5
patience: 50
seed: 42
aug_flags: 79
patch_t_min: -1.0
patch_t_max: 2.0
patch_perp_scale: 1.0
patch_h: 64
patch_w: 128
label_t_min: -0.5
label_t_max: 1.5
