backbone: custom
loss_fn: t
use_pq_ratio: false
use_sigmoid: true
num_conv_layers: 3
use_t_weighted_sampler: false
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 100
batch: 32
k: 5
patience: 50
seed: 42
use_batchnorm: true
aug_flags: 79
# --- EXP003 input params ---
# patch は広くとり周辺コンテキストを確保、label は base と同じ範囲に絞る（ミスマッチ条件）。
# patch のみ広くして余白をネットワークに見せつつ、予測対象範囲は基本通りにする。
patch_t_min: -1.0
patch_t_max: 2.0
patch_perp_scale: 1.0
patch_h: 64
patch_w: 128
label_t_min: -0.5
label_t_max: 1.5
