backbone: custom
loss_fn: t
use_pq_ratio: false
use_sigmoid: true
num_conv_layers: 3
use_t_weighted_sampler: false
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 100
batch: 32
k: 5
patience: 50
seed: 42
use_batchnorm: true
aug_flags: 79
# --- EXP003 input params ---
