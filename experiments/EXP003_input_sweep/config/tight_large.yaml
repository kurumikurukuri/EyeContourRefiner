backbone: custom
loss_fn: t
use_pq_ratio: false
use_sigmoid: true
num_conv_layers: 3
use_t_weighted_sampler: false
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 100
batch: 32
k: 5
patience: 50
seed: 42
use_batchnorm: true
aug_flags: 79
# --- EXP003 input params ---
# 複合: t 範囲を絞りつつ入力サイズを大きくする。
# 高解像度パッチで実データ範囲を精密に見る最有望な複合仮説。
patch_t_min: -0.25
patch_t_max: 1.25
patch_perp_scale: 1.0
patch_h: 96
patch_w: 192
label_t_min: null
label_t_max: null
