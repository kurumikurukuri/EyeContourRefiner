backbone: custom
loss_fn: t
use_pq_ratio: false
use_sigmoid: true
num_conv_layers: 3
use_t_weighted_sampler: false
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 100
batch: 32
k: 5
patience: 50
seed: 42
use_batchnorm: true
aug_flags: 79
# --- EXP003 input params ---
# 入力サイズ小（32×64）。軽量・正則化効果の確認。汎化性能への影響を検証。
patch_t_min: -0.5
patch_t_max: 1.5
patch_perp_scale: 1.0
patch_h: 32
patch_w: 64
label_t_min: null
label_t_max: null
