backbone: custom
loss_fn: t
use_pq_ratio: false
use_sigmoid: true
num_conv_layers: 3
use_t_weighted_sampler: false
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 100
batch: 32
k: 5
patience: 50
seed: 42
use_batchnorm: true
aug_flags: 79
# --- EXP003 input params ---
# 複合: t 範囲を広く揃えつつ入力サイズも大きくする。
# 広い context × 高解像度の組み合わせが有効かどうかを検証。
patch_t_min: -1.0
patch_t_max: 2.0
patch_perp_scale: 1.0
patch_h: 96
patch_w: 192
label_t_min: null
label_t_max: null
