<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>データ分析ダッシュボード</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4/build/index.umd.min.js"></script>
</head>
<body>

<div id="header">
  <a href="/" class="back-link">← アノテーターへ</a>
  <h1>データ分析ダッシュボード</h1>
  <button id="btn-refresh">↺ 更新</button>
</div>

<nav id="tab-nav">
  <button class="tab-btn active" data-tab="overview">Overview</button>
  <button class="tab-btn" data-tab="distrib">分布・統計</button>
  <button class="tab-btn" data-tab="outliers">外れ値確認</button>
  <button class="tab-btn" data-tab="errors">prediction.csv分析</button>
</nav>

<div id="content">

  <!-- ── Overview ── -->
  <div id="tab-overview" class="tab-panel active">
    <div id="overview-content"><div class="spinner"></div></div>
  </div>

  <!-- ── 分布・統計 ── -->
  <div id="tab-distrib" class="tab-panel">
    <div id="distrib-content"><p class="hint">タブを開くと読み込みます</p></div>
  </div>

  <!-- ── 外れ値確認 ── -->
  <div id="tab-outliers" class="tab-panel">
    <div id="outliers-content"><p class="hint">タブを開くと読み込みます</p></div>
  </div>

  <!-- ── prediction.csv分析 ── -->
  <div id="tab-errors" class="tab-panel">
    <div id="errors-content"><p class="hint">タブを開くと読み込みます</p></div>
  </div>

</div>

<script src="/static/dashboard.js?v=3"></script>
</body>
</html>
